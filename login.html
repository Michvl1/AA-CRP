<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MS Web Development</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { canvas:'#eceef1', surface:'#ffffff', inset:'#f6f7f9', line:'#e3e6ea',
            ink:'#191c20', inksoft:'#565c66', inkfaint:'#8a909a',
            pine:'#14624f', pinesoft:'#e7f0ec', gold:'#a06d15', goldsoft:'#fbf1dd',
            clay:'#b23c2b', claysoft:'#fbe9e6' },
  fontFamily: { display:['"Bricolage Grotesque"','sans-serif'], sans:['Inter','sans-serif'], mono:['"JetBrains Mono"','monospace'] }
}}}
</script>
<style>
  :root{ --pine:#14624f; }
  body{ background:#eceef1; color:#191c20; font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .font-display{ font-family:"Bricolage Grotesque",sans-serif; letter-spacing:-.02em; }
  .mono{ font-family:"JetBrains Mono",monospace; }
  .eyebrow{ font-family:"JetBrains Mono",monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; }
  .field{ background:#fff; border:1px solid #e3e6ea; border-radius:.7rem; padding:.7rem .85rem; font-size:.9rem; outline:none; transition:.15s; width:100%; }
  .field:focus{ border-color:var(--pine); box-shadow:0 0 0 3px rgba(20,98,79,.12); }
  :focus-visible{ outline:2px solid var(--pine); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
</head>

<body class="min-h-screen grid place-items-center p-5">
  <div class="w-full max-w-sm">

    <div class="flex items-center gap-3 justify-center mb-8">
      <div class="w-11 h-11 rounded-lg bg-ink text-white grid place-items-center mono text-sm font-semibold">ms</div>
      <div class="leading-tight">
        <div class="font-display font-bold text-lg">MS Web Development</div>
        <div class="eyebrow text-inkfaint">Request portal</div>
      </div>
    </div>

    <div class="bg-surface border border-line rounded-2xl p-7 shadow-sm">
      <h1 class="font-display text-2xl font-bold">Sign in</h1>
      <p class="text-sm text-inksoft mt-1">Access the request console.</p>

      <div id="err" class="hidden mt-4 rounded-lg bg-claysoft text-clay text-sm px-4 py-3 border border-clay/20"></div>

      <form id="loginForm" class="mt-5 space-y-4">
        <div>
          <label class="text-sm font-semibold" for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@studio.com" class="field mt-1.5">
        </div>
        <div>
          <div class="flex justify-between items-center">
            <label class="text-sm font-semibold" for="password">Password</label>
            <button type="button" id="forgot" class="text-xs text-pine font-semibold hover:underline">Forgot?</button>
          </div>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="field mt-1.5">
        </div>
        <button id="loginBtn" type="submit" class="w-full bg-ink text-white rounded-lg py-3 font-semibold text-sm hover:bg-black transition">Sign in</button>
      </form>
    </div>

    <p class="text-center eyebrow text-inkfaint mt-6">Protected area · MS Web Development</p>
  </div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { signInWithEmailAndPassword, signOut, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { doc, getDoc }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const form = document.getElementById('loginForm');
  const btn  = document.getElementById('loginBtn');
  const errEl = document.getElementById('err');

  // Message when the portal bounced a non-admin back here
  const params = new URLSearchParams(location.search);
  if (params.get('e') === 'notadmin') {
    showError("That account isn’t set up as an admin yet.");
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      const role = snap.exists() ? snap.data().role : null;

      if (role === 'admin') {
        location.replace('clientflow-portal.html');
      } else {
        // Client accounts exist in the data model, but their portal isn't built yet.
        await signOut(auth);
        showError("Signed in — but the client portal isn’t ready yet. Use an admin account for the console.");
      }
    } catch (err) {
      showError(friendly(err.code));
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });

  document.getElementById('forgot').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) { showError("Enter your email above first, then tap Forgot."); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      clearError();
      errEl.className = "mt-4 rounded-lg bg-pinesoft text-pine text-sm px-4 py-3 border border-pine/20";
      errEl.textContent = "Reset link sent. Check your inbox.";
      errEl.classList.remove('hidden');
    } catch (err) { showError(friendly(err.code)); }
  });

  function friendly(code){
    return ({
      'auth/invalid-email':      "That email doesn’t look right.",
      'auth/invalid-credential': "Wrong email or password.",
      'auth/user-not-found':     "No account with that email.",
      'auth/wrong-password':     "Wrong email or password.",
      'auth/too-many-requests':  "Too many attempts. Wait a minute and try again.",
      'auth/network-request-failed': "Network problem — check your connection."
    })[code] || "Couldn’t sign in. Try again.";
  }
  function showError(msg){
    errEl.className = "mt-4 rounded-lg bg-claysoft text-clay text-sm px-4 py-3 border border-clay/20";
    errEl.textContent = msg; errEl.classList.remove('hidden');
  }
  function clearError(){ errEl.classList.add('hidden'); }
</script>
</body>
</html>
