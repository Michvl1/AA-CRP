<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Requests / Updates</title>

<!-- Firebase (compat SDK — works from a plain <script>, no build step) -->

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>

<!-- React + Babel (Babel transpiles the JSX in the browser) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --paper:#EDF0EA; --surface:#FFFFFF; --ink:#16202E; --ink2:#525C6A;
  --line:#DCE1DB; --line2:#E9EDE7; --brand:#0E6E63; --brand-ink:#0A4A43;
  --s-new:#2563EB; --s-prog:#B45309; --s-info:#7C3AED; --s-done:#157347; --s-cancel:#6B7280;
  --disp:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
.cp{font-family:var(--body); color:var(--ink); min-height:100vh; background-color:var(--paper);
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:26px 26px;}
.cp button{font-family:var(--body); cursor:pointer}
.wrap{max-width:1120px; margin:0 auto; padding:0 20px}
.top{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 0; border-bottom:1px solid var(--line);}
.brand{display:flex; align-items:center; gap:11px}
.mark{width:30px; height:30px; border-radius:8px; background:var(--brand); display:grid; place-items:center; color:#fff;
  font-family:var(--mono); font-weight:600; font-size:15px; box-shadow:inset 0 0 0 1px var(--brand-ink);}
.brand h1{font-family:var(--disp); font-weight:700; font-size:16px; letter-spacing:-.01em; margin:0; line-height:1}
.brand .sub{font-size:11px; color:var(--ink2); letter-spacing:.02em; margin-top:2px}
.who{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink2)}
.role-tag{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.04em; padding:4px 8px; border-radius:6px; text-transform:uppercase;}
.role-admin{background:#F0FAF4; color:var(--s-done); box-shadow:inset 0 0 0 1px #CBE9D6}
.role-client{background:#EEF3FF; color:var(--s-new); box-shadow:inset 0 0 0 1px #D3E0FC}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; padding:8px 13px; border-radius:9px; transition:.14s;}
.btn:hover{border-color:#c3cabf; background:#fbfcfa}
.btn-primary{background:var(--brand); border-color:var(--brand-ink); color:#fff; box-shadow:0 1px 0 var(--brand-ink);}
.btn-primary:hover{background:#0c7c6f; border-color:var(--brand-ink)}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.link{background:none; border:none; color:var(--brand); font-weight:600; font-size:12.5px; padding:0}
.link:hover{text-decoration:underline}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px}
.eyebrow{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2);}
.field{display:block; margin-bottom:14px}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:6px}
.input,.textarea,.select{width:100%; font-family:var(--body); font-size:13.5px; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:9px 11px; background:var(--surface); transition:.14s}
.textarea{min-height:96px; resize:vertical; line-height:1.5}
.input:focus,.textarea:focus,.select:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,110,99,.14)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.ticket{position:relative; display:block; width:100%; text-align:left; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px 14px 20px; transition:.14s; margin-bottom:10px}
.ticket:hover{border-color:#c3cabf; transform:translateY(-1px); box-shadow:0 6px 18px -12px rgba(22,32,46,.4)}
.ticket .rail{position:absolute; left:0; top:0; bottom:0; width:5px}
.ticket.sel{border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,110,99,.12)}
.t-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
.t-code{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink2); letter-spacing:.02em}
.t-title{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:-.01em; margin:0 0 4px; line-height:1.25}
.t-desc{font-size:12.5px; color:var(--ink2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.t-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center}
.badge{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.03em; padding:3px 8px; border-radius:999px; text-transform:uppercase; white-space:nowrap}
.pri{font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px}
.pri-urgent{background:#FDECEC; color:#B42318}
.pri-high{background:#FEF3E6; color:#B45309}
.pri-medium{background:#EEF3FF; color:#2563EB}
.pri-low{background:#F1F3F0; color:#525C6A}
.type-chip{font-size:11px; color:var(--ink2); background:#F3F5F1; padding:3px 8px; border-radius:6px}
.two{display:grid; grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr); gap:22px; align-items:start; padding:26px 0 60px}
.admin{display:grid; grid-template-columns:210px minmax(0,1fr); gap:22px; padding:22px 0 60px; align-items:start}
.side .navi{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:none; border:none; padding:9px 11px; border-radius:9px; font-size:13px; color:var(--ink2); font-weight:500}
.side .navi:hover{background:var(--surface)}
.side .navi.on{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--line)}
.side .navi .n{font-family:var(--mono); font-size:11px; color:var(--ink2)}
.side .navi.on .n{color:var(--brand)}
.stack-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 0 14px}
.stack-head h2{font-family:var(--disp); font-weight:700; font-size:18px; letter-spacing:-.01em; margin:0}
.detail{position:sticky; top:18px}
.d-status-row{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px}
.d-block{border-top:1px solid var(--line2); padding-top:14px; margin-top:14px}
.d-label{font-size:11px; font-weight:600; color:var(--ink2); margin-bottom:6px}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:5px 0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:500; text-align:right}
.act{list-style:none; margin:0; padding:0}
.act li{position:relative; padding:0 0 14px 20px; font-size:12.5px; color:var(--ink)}
.act li:before{content:''; position:absolute; left:3px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.act li:after{content:''; position:absolute; left:6.5px; top:12px; bottom:0; width:1px; background:var(--line)}
.act li:last-child:after{display:none}
.act .ts{font-family:var(--mono); font-size:10.5px; color:var(--ink2); display:block; margin-top:2px}
.act .actor{font-weight:600}
.ai{margin-top:14px; border:1px dashed #C9CFC6; border-radius:11px; padding:14px; background:#F7F9F5}
.ai h4{font-family:var(--disp); font-size:13px; margin:0 0 4px; display:flex; align-items:center; gap:7px}
.ai .soon{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#fff; background:var(--ink2); padding:2px 6px; border-radius:5px}
.ai p{font-size:12px; color:var(--ink2); line-height:1.5; margin:0 0 10px}
.empty{text-align:center; padding:40px 20px; color:var(--ink2)}
.empty .em-mark{font-family:var(--mono); font-size:12px; color:var(--brand); margin-bottom:8px; letter-spacing:.1em}
.empty h3{font-family:var(--disp); font-weight:600; font-size:16px; color:var(--ink); margin:0 0 6px}
.empty p{font-size:13px; margin:0 auto; max-width:280px; line-height:1.5}
.gate{max-width:400px; margin:70px auto; text-align:center}
.gate .mark{width:44px; height:44px; margin:0 auto 16px; font-size:20px; border-radius:12px}
.gate h2{font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:-.02em; margin:0 0 6px}
.gate p{font-size:13.5px; color:var(--ink2); line-height:1.5; margin:0 0 22px}
.hint{font-family:var(--mono); font-size:11px; color:var(--ink2); background:#F3F5F1; border-radius:7px; padding:7px 10px; margin-top:12px; display:inline-block}
.foot{border-top:1px solid var(--line); padding:16px 0 26px; font-size:11.5px; color:var(--ink2); text-align:center}
@media (max-width:820px){
  .two{grid-template-columns:1fr}
  .admin{grid-template-columns:1fr}
  .side{display:flex; overflow-x:auto; gap:6px; padding-bottom:4px}
  .side .navi{width:auto; white-space:nowrap}
  .detail{position:static}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
.btn:focus-visible,.input:focus-visible,.textarea:focus-visible,.select:focus-visible,.ticket:focus-visible,.navi:focus-visible,.link:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const auth = window.auth, db = window.db;
const ADMIN_EMAILS = (window.ADMIN_EMAILS || []).map((e) => e.toLowerCase());
const STUDIO_EMAIL = window.STUDIO_EMAIL || "";
const PRICING_URL = window.PRICING_URL || "#";

// ---- token economy ----
const MONTHLY_FREE = 10;                                   // free tokens granted each month (do not roll over)
const PRIORITY_COST = { low: 1, medium: 2, high: 4, urgent: 6 };
const TYPE_COST = {
  "Content update": 3, "Bug fix": 2, "New feature": 10,
  "Design change": 5, "SEO": 4, "Other": 3,               // "Other" wasn't specified — default 3, adjust to taste
};
const costOf = (type, priority) => (TYPE_COST[type] || 0) + (PRIORITY_COST[priority] || 0);
const ymNow = () => new Date().toISOString().slice(0, 7); // e.g. "2026-08"
const FieldValue = firebase.firestore.FieldValue;

const mailtoImages = (r) =>
  `mailto:${STUDIO_EMAIL}?subject=${encodeURIComponent(r.code)}` +
  `&body=${encodeURIComponent(`Images for "${r.title}" (${r.code}).\n\nPlease attach your images to this email. Keep ${r.code} in the subject so they link to the right request.`)}`;

const STATUS = {
  new:        { label: "New",         color: "var(--s-new)",   bg: "#EEF3FF", fg: "#2563EB" },
  in_progress:{ label: "In progress", color: "var(--s-prog)",  bg: "#FEF3E6", fg: "#B45309" },
  needs_info: { label: "Needs info",  color: "var(--s-info)",  bg: "#F3EEFE", fg: "#7C3AED" },
  done:       { label: "Done",        color: "var(--s-done)",  bg: "#F0FAF4", fg: "#157347" },
  cancelled:  { label: "Cancelled",   color: "var(--s-cancel)",bg: "#F1F3F0", fg: "#6B7280" },
};
const TYPES = ["Content update", "Bug fix", "New feature", "Design change", "SEO", "Other"];
const PRIORITIES = ["low", "medium", "high", "urgent"];

const code = () => "REQ-" + Math.random().toString(36).slice(2, 6).toUpperCase();
const now = () => Date.now();
const fmt = (t) => t ? new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const ago = (t) => {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
function authMsg(c) {
  switch (c) {
    case "auth/invalid-email": return "That email address doesn't look right.";
    case "auth/missing-password": return "Enter your password.";
    case "auth/weak-password": return "Password should be at least 6 characters.";
    case "auth/email-already-in-use": return "An account already exists for that email. Try signing in.";
    case "auth/too-many-requests": return "Too many attempts. Wait a moment and try again.";
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found": return "Email or password is incorrect.";
    default: return "Something went wrong. Please try again.";
  }
}

function Badge({ status }) {
  const s = STATUS[status] || STATUS.new;
  return <span className="badge" style={{ background: s.bg, color: s.fg }}>{s.label}</span>;
}
function Ticket({ r, onClick, selected }) {
  const s = STATUS[r.status] || STATUS.new;
  return (
    <button className={"ticket" + (selected ? " sel" : "")} onClick={onClick}>
      <span className="rail" style={{ background: s.color }} />
      <div className="t-head"><span className="t-code">{r.code}</span><Badge status={r.status} /></div>
      <p className="t-title">{r.title}</p>
      <p className="t-desc">{r.description}</p>
      <div className="t-meta">
        <span className={"pri pri-" + r.priority}>{r.priority}</span>
        <span className="type-chip">{r.type}</span>
        {r.cost != null && <span className="type-chip">−{r.cost}</span>}
        <span className="t-code" style={{ marginLeft: "auto" }}>{ago(r.createdAt)}</span>
      </div>
    </button>
  );
}

/* ---------------- shell + auth ---------------- */
function Shell({ user, isAdmin, onSignOut, children }) {
  return (
    <div className="cp"><div className="wrap">
      <header className="top">
        <div className="brand">
          <div className="mark">◑</div>
          <div>
            <h1>Requests<span style={{ color: "var(--brand)" }}>/</span>Studio</h1>
            <div className="sub">Change requests, from ask to done</div>
          </div>
        </div>
        {user && (
          <div className="who">
            <span className={"role-tag " + (isAdmin ? "role-admin" : "role-client")}>{isAdmin ? "Admin" : "Client"}</span>
            <span style={{ fontSize: 12 }}>{user.email}</span>
            <button className="link" onClick={onSignOut}>Sign out</button>
          </div>
        )}
      </header>
      {children}
    </div></div>
  );
}
function Splash() {
  return <div className="cp"><div className="wrap"><div className="empty" style={{ paddingTop: 90 }}>
    <div className="em-mark">LOADING</div><p>Opening the portal…</p></div></div></div>;
}

function AuthScreen() {
  const [mode, setMode] = useState("in");
  const [f, setF] = useState({ email: "", password: "", name: "", website: "" });
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const up = mode === "up";
  const ok = f.email.trim() && f.password && (!up || (f.name.trim() && f.website.trim()));
  const submit = async () => {
    if (!ok || busy) return;
    setErr(""); setBusy(true);
    try {
      if (up) {
        const cred = await auth.createUserWithEmailAndPassword(f.email.trim(), f.password);
        await db.collection("users").doc(cred.user.uid).set(
          { name: f.name.trim(), website: f.website.trim(), email: cred.user.email,
            freeTokens: MONTHLY_FREE, purchasedTokens: 0, tokenPeriod: ymNow() }, { merge: true });
      } else {
        await auth.signInWithEmailAndPassword(f.email.trim(), f.password);
      }
    } catch (e) { setErr(authMsg(e.code)); setBusy(false); }
  };
  return (
    <div className="gate" style={{ maxWidth: 420 }}>
      <div className="mark" style={{ background: "var(--brand)", color: "#fff" }}>◑</div>
      <h2>{up ? "Create your account" : "Sign in"}</h2>
      <p>{up ? "Set up access to file and track change requests." : "Welcome back. Sign in to your portal."}</p>
      <div className="panel" style={{ padding: 20, textAlign: "left" }}>
        {up && (<>
          <div className="field"><label>Your name</label>
            <input className="input" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="Jamie Rivera" /></div>
          <div className="field"><label>Website</label>
            <input className="input" value={f.website} onChange={(e) => setF({ ...f, website: e.target.value })} placeholder="acme.com" /></div>
        </>)}
        <div className="field"><label>Email</label>
          <input className="input" type="email" value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} placeholder="you@company.com" /></div>
        <div className="field"><label>Password</label>
          <input className="input" type="password" value={f.password} onChange={(e) => setF({ ...f, password: e.target.value })}
            onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="••••••••" /></div>
        {err && <p style={{ color: "#B42318", fontSize: 12, margin: "0 0 10px" }}>{err}</p>}
        <button className="btn btn-primary" style={{ width: "100%" }} disabled={!ok || busy} onClick={submit}>
          {busy ? "Working…" : (up ? "Create account" : "Sign in")}
        </button>
        <p style={{ fontSize: 12.5, color: "var(--ink2)", margin: "12px 0 0", textAlign: "center" }}>
          {up ? "Already have an account? " : "New here? "}
          <button className="link" onClick={() => { setMode(up ? "in" : "up"); setErr(""); }}>{up ? "Sign in" : "Create one"}</button>
        </p>
      </div>
    </div>
  );
}

function ProfileSetup({ onSave }) {
  const [f, setF] = useState({ name: "", website: "" });
  const ok = f.name.trim() && f.website.trim();
  return (
    <div className="gate" style={{ maxWidth: 440 }}>
      <h2>Finish your profile</h2>
      <p>Tell us who you are so we know which site your requests are for.</p>
      <div className="panel" style={{ padding: 20, textAlign: "left" }}>
        <div className="field"><label>Your name</label>
          <input className="input" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="Jamie Rivera" /></div>
        <div className="field"><label>Website</label>
          <input className="input" value={f.website} onChange={(e) => setF({ ...f, website: e.target.value })} placeholder="acme.com" /></div>
        <button className="btn btn-primary" style={{ width: "100%" }} disabled={!ok}
          onClick={() => onSave({ name: f.name.trim(), website: f.website.trim() })}>Save profile</button>
      </div>
    </div>
  );
}

/* ---------------- client ---------------- */
function ClientView({ profile, requests, createRequest, updateRequest, tokens, freeNow, purchasedNow }) {
  return (
    <>
    <div className="panel" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "12px 16px", marginTop: 22 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
        <span className="mark" style={{ width: 30, height: 30, fontSize: 15 }}>◆</span>
        <div>
          <div style={{ fontFamily: "var(--disp)", fontWeight: 700, fontSize: 15, lineHeight: 1.1 }}>{tokens} tokens available</div>
          <div style={{ fontSize: 11, color: "var(--ink2)", marginTop: 2 }}>{freeNow} monthly (resets each month) · {purchasedNow} purchased</div>
        </div>
      </div>
      <a className="btn btn-sm" href={PRICING_URL} target="_blank" rel="noopener">Buy tokens</a>
    </div>
    <div className="two" style={{ paddingTop: 22 }}>
      <NewRequestForm onSubmit={createRequest} who={profile} tokens={tokens} />
      <div>
        <div className="stack-head"><h2>Your requests</h2><span className="eyebrow">{requests.length} total</span></div>
        {requests.length === 0 ? (
          <div className="panel empty">
            <div className="em-mark">NO REQUESTS YET</div>
            <h3>Nothing filed</h3>
            <p>Send your first change request using the form. You'll see its status update here.</p>
          </div>
        ) : requests.map((r) => <ClientTicket key={r.id} r={r} updateRequest={updateRequest} who={profile} />)}
      </div>
    </div>
    </>
  );
}

function NewRequestForm({ onSubmit, who, tokens }) {
  const empty = { title: "", description: "", type: TYPES[0], priority: "medium", page: "" };
  const [f, setF] = useState(empty);
  const [sent, setSent] = useState(null);
  const [busy, setBusy] = useState(false);
  const cost = costOf(f.type, f.priority);
  const enough = tokens >= cost;
  const ok = f.title.trim() && f.description.trim();
  const send = async () => {
    if (!ok || busy || !enough) return;
    setBusy(true);
    try {
      const r = await onSubmit({ title: f.title.trim(), description: f.description.trim(), type: f.type, priority: f.priority, page: f.page.trim() });
      setF(empty); setSent(r || null);
    } catch (e) {
      if (e && e.code === "insufficient") alert(`Not enough tokens for this request (needs ${cost}). Please buy more.`);
      else alert("Couldn't send the request. Check your connection and try again.");
    }
    setBusy(false);
  };

  if (sent) {
    return (
      <div className="panel" style={{ padding: 20 }}>
        <div className="eyebrow" style={{ marginBottom: 4 }}>Request filed</div>
        <h2 style={{ fontFamily: "var(--disp)", fontSize: 18, fontWeight: 700, margin: "0 0 6px", letterSpacing: "-.01em" }}>We've got it.</h2>
        <p style={{ fontSize: 13, color: "var(--ink2)", lineHeight: 1.55, margin: "0 0 14px" }}>
          Your request ID is <b style={{ color: "var(--ink)", fontFamily: "var(--mono)" }}>{sent.code}</b>. Track its status under “Your requests.”
        </p>
        <div className="ai" style={{ marginTop: 0 }}>
          <h4 style={{ marginBottom: 6 }}>◆ Adding images to this request?</h4>
          <p>Email them to <b style={{ color: "var(--ink)" }}>{STUDIO_EMAIL}</b> with{" "}
            <b style={{ color: "var(--ink)", fontFamily: "var(--mono)" }}>{sent.code}</b> as the subject, and they'll be matched to this request.</p>
          <a className="btn btn-primary btn-sm" href={mailtoImages(sent)} style={{ display: "inline-block", textDecoration: "none" }}>Email your images</a>
        </div>
        <button className="btn" style={{ width: "100%", marginTop: 14 }} onClick={() => setSent(null)}>File another request</button>
      </div>
    );
  }

  return (
    <div className="panel" style={{ padding: 20 }}>
      <div className="eyebrow" style={{ marginBottom: 4 }}>New request · {who.website}</div>
      <h2 style={{ fontFamily: "var(--disp)", fontSize: 18, fontWeight: 700, margin: "0 0 16px", letterSpacing: "-.01em" }}>What needs changing?</h2>
      <div className="field"><label>Summary</label>
        <input className="input" value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} placeholder="Update the hours on the contact page" /></div>
      <div className="field"><label>Details</label>
        <textarea className="textarea" value={f.description} onChange={(e) => setF({ ...f, description: e.target.value })}
          placeholder="Describe the change. Include exact text, links, or images where you can." /></div>
      <div className="row2">
        <div className="field"><label>Type</label>
          <select className="select" value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>
            {TYPES.map((t) => <option key={t} value={t}>{t} (−{TYPE_COST[t]})</option>)}</select></div>
        <div className="field"><label>Priority</label>
          <select className="select" value={f.priority} onChange={(e) => setF({ ...f, priority: e.target.value })}>
            {PRIORITIES.map((p) => <option key={p} value={p}>{p[0].toUpperCase() + p.slice(1)} (−{PRIORITY_COST[p]})</option>)}</select></div>
      </div>
      <div className="field"><label>Page or URL <span style={{ color: "var(--ink2)", fontWeight: 400 }}>(optional)</span></label>
        <input className="input" value={f.page} onChange={(e) => setF({ ...f, page: e.target.value })} placeholder="/contact" /></div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12.5, padding: "10px 0", borderTop: "1px solid var(--line2)", marginTop: 4 }}>
        <span style={{ color: "var(--ink2)" }}>Cost of this request</span>
        <span style={{ fontFamily: "var(--mono)", fontWeight: 600, color: enough ? "var(--ink)" : "#B42318" }}>
          −{cost} tokens · {tokens} left
        </span>
      </div>
      {!enough ? (
        <div className="ai" style={{ marginTop: 0, borderColor: "#F0C9C9", background: "#FDF3F3" }}>
          <h4 style={{ marginBottom: 6 }}>Not enough tokens</h4>
          <p>This request needs {cost} tokens and you have {tokens}. Top up to submit it.</p>
          <a className="btn btn-primary btn-sm" href={PRICING_URL} target="_blank" rel="noopener" style={{ display: "inline-block", textDecoration: "none" }}>Buy more tokens</a>
        </div>
      ) : (
        <div className="hint" style={{ display: "block", marginBottom: 12 }}>Have images? Send this first — you'll get a request ID to email them with.</div>
      )}
      <button className="btn btn-primary" style={{ width: "100%", marginTop: enough ? 0 : 12 }} disabled={!ok || busy || !enough} onClick={send}>
        {busy ? "Sending…" : `Send request (−${cost})`}
      </button>
    </div>
  );
}

function ClientTicket({ r, updateRequest, who }) {
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState("");
  const s = STATUS[r.status] || STATUS.new;
  const reply = async () => {
    if (!msg.trim()) return;
    await updateRequest(r.id, { activity: [...r.activity, { ts: now(), actor: who.name, kind: "reply", text: msg.trim() }] });
    setMsg("");
  };
  return (
    <div className="ticket" style={{ cursor: "default", paddingLeft: 20 }}>
      <span className="rail" style={{ background: s.color }} />
      <div className="t-head"><span className="t-code">{r.code}</span><Badge status={r.status} /></div>
      <p className="t-title">{r.title}</p>
      <p className="t-desc" style={{ WebkitLineClamp: open ? "unset" : 2 }}>{r.description}</p>
      <div className="t-meta">
        <span className={"pri pri-" + r.priority}>{r.priority}</span>
        <span className="type-chip">{r.type}</span>
        <a className="link" style={{ marginLeft: "auto" }} href={mailtoImages(r)}>Email images</a>
        <button className="link" onClick={() => setOpen(!open)}>{open ? "Hide activity" : "View activity"}</button>
      </div>
      {open && (
        <div className="d-block">
          <ul className="act">
            {(r.activity || []).map((a, i) => (<li key={i}><span className="actor">{a.actor}</span> — {a.text}<span className="ts">{fmt(a.ts)}</span></li>))}
          </ul>
          {r.status === "needs_info" && (
            <div style={{ marginTop: 6 }}>
              <textarea className="textarea" style={{ minHeight: 64 }} value={msg} onChange={(e) => setMsg(e.target.value)}
                placeholder="Reply with the info the studio needs…" />
              <button className="btn btn-primary btn-sm" style={{ marginTop: 8 }} onClick={reply}>Send reply</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------- admin ---------------- */
function AdminView({ requests, updateRequest, grantTokens }) {
  const [filter, setFilter] = useState("open");
  const [selId, setSelId] = useState(null);
  const openSet = ["new", "in_progress", "needs_info"];
  const counts = {
    open: requests.filter((r) => openSet.includes(r.status)).length,
    new: requests.filter((r) => r.status === "new").length,
    in_progress: requests.filter((r) => r.status === "in_progress").length,
    needs_info: requests.filter((r) => r.status === "needs_info").length,
    done: requests.filter((r) => r.status === "done").length,
    all: requests.length,
  };
  const shown = requests.filter((r) =>
    filter === "open" ? openSet.includes(r.status) : filter === "all" ? true : r.status === filter);
  const sel = requests.find((r) => r.id === selId) || null;
  const navi = [["open", "Open queue"], ["new", "New"], ["in_progress", "In progress"], ["needs_info", "Needs info"], ["done", "Done"], ["all", "Everything"]];

  return (
    <div className="admin">
      <aside className="side">
        {navi.map(([k, label]) => (
          <button key={k} className={"navi" + (filter === k ? " on" : "")} onClick={() => setFilter(k)}>
            <span>{label}</span><span className="n">{counts[k] ?? 0}</span>
          </button>
        ))}
      </aside>
      <div>
        {sel ? (
          <RequestDetail r={sel} onBack={() => setSelId(null)} updateRequest={updateRequest} grantTokens={grantTokens} />
        ) : (<>
          <div className="stack-head">
            <h2>{navi.find((n) => n[0] === filter)[1]}</h2>
            <span className="eyebrow">{shown.length} shown</span>
          </div>
          {shown.length === 0 ? (
            <div className="panel empty">
              <div className="em-mark">QUEUE CLEAR</div><h3>Nothing here</h3>
              <p>No requests match this filter. Nice — the queue's under control.</p>
            </div>
          ) : shown.map((r) => <Ticket key={r.id} r={r} onClick={() => setSelId(r.id)} />)}
        </>)}
      </div>
    </div>
  );
}

function GrantTokens({ uid, grantTokens }) {
  const [n, setN] = useState(10);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const add = async () => {
    if (!n || n <= 0 || busy) return;
    setBusy(true);
    try { await grantTokens(uid, n); setMsg("Added " + n + " purchased tokens"); }
    catch (e) { setMsg("Couldn't add tokens"); }
    setBusy(false);
  };
  return (
    <div style={{ marginTop: 12 }}>
      <div className="d-label" style={{ marginBottom: 6 }}>Credit purchased tokens (after they pay)</div>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <input className="input" type="number" min="1" value={n} onChange={(e) => setN(parseInt(e.target.value) || 0)} style={{ width: 90 }} />
        <button className="btn btn-sm" onClick={add} disabled={busy}>{busy ? "Adding…" : "Add tokens"}</button>
      </div>
      {msg && <p style={{ fontSize: 11.5, color: "var(--s-done)", margin: "8px 0 0" }}>{msg}</p>}
    </div>
  );
}

function RequestDetail({ r, onBack, updateRequest, grantTokens }) {
  const [note, setNote] = useState("");
  const change = async (status, text) =>
    updateRequest(r.id, { status, activity: [...r.activity, { ts: now(), actor: "Admin", kind: "status", text: text || ("Status → " + STATUS[status].label) }] });
  const addNote = async () => {
    if (!note.trim()) return;
    await updateRequest(r.id, { activity: [...r.activity, { ts: now(), actor: "Admin", kind: "note", text: note.trim() }] });
    setNote("");
  };
  const actions = {
    new: [["Start work", () => change("in_progress")], ["Ask for info", () => change("needs_info", "Asked client for more info")]],
    in_progress: [["Mark done", () => change("done", "Work completed")], ["Ask for info", () => change("needs_info", "Asked client for more info")]],
    needs_info: [["Resume work", () => change("in_progress")]],
    done: [["Reopen", () => change("in_progress", "Reopened")]],
    cancelled: [["Reopen", () => change("new", "Reopened")]],
  };
  return (
    <div className="detail">
      <button className="link" onClick={onBack}>← Back to queue</button>
      <div className="panel" style={{ padding: 20, marginTop: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <span className="t-code">{r.code}</span><Badge status={r.status} />
        </div>
        <h2 style={{ fontFamily: "var(--disp)", fontSize: 20, fontWeight: 700, margin: "8px 0 10px", letterSpacing: "-.01em" }}>{r.title}</h2>
        <div className="t-meta" style={{ marginTop: 0 }}>
          <span className={"pri pri-" + r.priority}>{r.priority}</span>
          <span className="type-chip">{r.type}</span>
          {r.page && <span className="type-chip">{r.page}</span>}
          {r.cost != null && <span className="type-chip">−{r.cost} tokens</span>}
        </div>
        <div className="d-status-row">
          {(actions[r.status] || []).map(([label, fn], i) => (
            <button key={i} className={"btn btn-sm" + (i === 0 ? " btn-primary" : "")} onClick={fn}>{label}</button>
          ))}
          {r.status !== "cancelled" && r.status !== "done" && (
            <button className="btn btn-sm" onClick={() => change("cancelled", "Request cancelled")} style={{ marginLeft: "auto", color: "var(--s-cancel)" }}>Cancel</button>
          )}
        </div>
        <div className="d-block">
          <div className="d-label">Request</div>
          <p style={{ fontSize: 13, lineHeight: 1.6, color: "var(--ink)", margin: 0, whiteSpace: "pre-wrap" }}>{r.description}</p>
        </div>
        <div className="d-block">
          <div className="d-label">Images</div>
          <p style={{ fontSize: 12.5, lineHeight: 1.5, color: "var(--ink2)", margin: 0 }}>
            Client images (if any) arrive by email with <b style={{ color: "var(--ink)", fontFamily: "var(--mono)", fontWeight: 600 }}>{r.code}</b> in the subject.
          </p>
        </div>
        <div className="d-block">
          <div className="d-label">Client</div>
          <div className="kv"><span>Name</span><span>{r.client.name}</span></div>
          <div className="kv"><span>Email</span><span>{r.client.email}</span></div>
          <div className="kv"><span>Website</span><span>{r.client.website}</span></div>
          <div className="kv"><span>Filed</span><span>{fmt(r.createdAt)}</span></div>
          <GrantTokens uid={r.client.uid} grantTokens={grantTokens} />
        </div>
        <div className="ai">
          <h4>◆ Draft with AI agent <span className="soon">soon</span></h4>
          <p>Later, an agent will draft the change for this request and wait for your verification before anything ships. For now the queue is all yours.</p>
          <button className="btn btn-sm" disabled>Generate draft</button>
        </div>
        <div className="d-block">
          <div className="d-label">Activity</div>
          <ul className="act">
            {(r.activity || []).map((a, i) => (<li key={i}><span className="actor">{a.actor}</span> — {a.text}<span className="ts">{fmt(a.ts)}</span></li>))}
          </ul>
          <textarea className="textarea" style={{ minHeight: 64 }} value={note} onChange={(e) => setNote(e.target.value)}
            placeholder="Add an internal note or a message for the client…" />
          <button className="btn btn-sm" style={{ marginTop: 8 }} onClick={addNote}>Add note</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- app root ---------------- */
function App() {
  const [authReady, setAuthReady] = useState(false);
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [requests, setRequests] = useState([]);
  const isAdmin = !!user && ADMIN_EMAILS.includes((user.email || "").toLowerCase());

  useEffect(() => auth.onAuthStateChanged((u) => { setUser(u); setAuthReady(true); }), []);

  useEffect(() => {
    if (!user) { setProfile(null); return; }
    return db.collection("users").doc(user.uid).onSnapshot(
      (d) => setProfile(d.exists ? d.data() : null), () => setProfile(null));
  }, [user]);

  useEffect(() => {
    if (!user) { setRequests([]); return; }
    const q = isAdmin ? db.collection("requests") : db.collection("requests").where("client.uid", "==", user.uid);
    return q.onSnapshot((snap) => {
      const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      setRequests(rows);
    }, (e) => console.error(e));
  }, [user, isAdmin]);

  const createRequest = async (data) => {
    const cost = costOf(data.type, data.priority);
    const userRef = db.collection("users").doc(user.uid);
    const reqRef = db.collection("requests").doc();
    const period = ymNow();
    const nm = (profile && profile.name) || user.email;
    const rec = {
      code: code(),
      client: { uid: user.uid, name: nm, email: user.email, website: (profile && profile.website) || "" },
      ...data, cost, status: "new", createdAt: now(), updatedAt: now(),
      activity: [{ ts: now(), actor: nm, kind: "created", text: "Request submitted · " + cost + " tokens" }],
    };
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(userRef);
      const u = snap.exists ? snap.data() : {};
      const free = (u.tokenPeriod !== period) ? MONTHLY_FREE : (u.freeTokens != null ? u.freeTokens : MONTHLY_FREE);
      const purchased = u.purchasedTokens || 0;
      if (free + purchased < cost) { const e = new Error("insufficient"); e.code = "insufficient"; throw e; }
      const fromFree = Math.min(free, cost);            // spend expiring monthly tokens first
      tx.set(userRef, {
        freeTokens: free - fromFree,
        purchasedTokens: purchased - (cost - fromFree),
        tokenPeriod: period,
        email: user.email,
      }, { merge: true });
      tx.set(reqRef, rec);
    });
    return { id: reqRef.id, ...rec };
  };
  const updateRequest = (id, patch) => db.collection("requests").doc(id).update({ ...patch, updatedAt: now() });
  const saveProfile = (p) => db.collection("users").doc(user.uid).set({ ...p, email: user.email }, { merge: true });
  const grantTokens = (uid, n) => db.collection("users").doc(uid).set({ purchasedTokens: FieldValue.increment(n) }, { merge: true });

  // Monthly grant: reset free tokens to MONTHLY_FREE when the period rolls over (purchased tokens untouched).
  useEffect(() => {
    if (!user || isAdmin || !profile) return;
    if (profile.tokenPeriod !== ymNow()) {
      db.collection("users").doc(user.uid)
        .set({ freeTokens: MONTHLY_FREE, tokenPeriod: ymNow(), email: user.email }, { merge: true })
        .catch((e) => console.error(e));
    }
  }, [user, isAdmin, profile]);

  // Current balance for display (applies the reset in-memory even before it's persisted).
  const period = ymNow();
  const freeNow = profile ? ((profile.tokenPeriod !== period) ? MONTHLY_FREE : (profile.freeTokens != null ? profile.freeTokens : MONTHLY_FREE)) : 0;
  const purchasedNow = profile ? (profile.purchasedTokens || 0) : 0;
  const tokens = freeNow + purchasedNow;

  if (!authReady) return <Splash />;
  if (!user) return <Shell><AuthScreen /></Shell>;

  return (
    <Shell user={user} isAdmin={isAdmin} onSignOut={() => auth.signOut()}>
      {isAdmin
        ? <AdminView requests={requests} updateRequest={updateRequest} grantTokens={grantTokens} />
        : (profile
          ? <ClientView profile={{ ...profile, email: user.email }} requests={requests} createRequest={createRequest} updateRequest={updateRequest}
              tokens={tokens} freeNow={freeNow} purchasedNow={purchasedNow} />
          : <ProfileSetup onSave={saveProfile} />)}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
